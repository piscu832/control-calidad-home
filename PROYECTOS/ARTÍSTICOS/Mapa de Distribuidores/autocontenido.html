<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Distribuidores — VILLALBA HNOS. IMPLANTES S.A.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* ==========================================================================
   MAPA INTERACTIVO DE DISTRIBUIDORES — VILLALBA HNOS. IMPLANTES S.A.
   Versión Exclusiva: Mapa Limpio con Animación de Flechas en Hover
   ========================================================================== */

:root, .map-viewport {
  --cyan-core: #00e5ff;
  --cyan-bright: #38bdf8;
  --cyan-glow: rgba(0, 229, 255, 0.7);
  --cyan-halo: rgba(0, 229, 255, 0.35);
  --navy-dark: #071930;
  --bg-page: transparent;
  --font-tech: 'Chakra Petch', sans-serif;
  --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
  --transition-smooth: 0.38s cubic-bezier(0.16, 1, 0.3, 1);
  --transition-fast: 0.2s ease;
}

/* Reset acotado y seguro: NO afecta al sitio web contenedor ni a elementos externos */
.map-viewport,
.map-viewport *,
.map-viewport *::before,
.map-viewport *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* Si se abre directamente en iframe o página independiente */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: transparent !important;
  background-color: transparent !important;
}

/* Contenedor Vista Principal: 100% fluido y seguro, no invade la grilla de la web */
.map-viewport {
  width: 100%;
  max-width: 100%;
  margin: 0 auto;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  background: transparent !important;
  overflow: visible;
  padding: 0;
  font-family: var(--font-sans);
  color: var(--navy-dark);
}

/* Contenedor del Mapa (Auto-escalable y proporcional 896 / 1200) */
.map-interactive-container {
  position: relative;
  width: 100%;
  max-width: min(860px, calc(90vh * 896 / 1200));
  aspect-ratio: 896 / 1200;
  margin: 0 auto;
  background: transparent !important;
  display: block;
  user-select: none;
  overflow: visible;
}

/* Imagen base rasterizada (Circuitos y silueta de Argentina) */
.map-base-raster {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
}

/* Capa SVG Vectorial */
.map-vector-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* ==========================================================================
   ESTILOS DE ELEMENTOS VECTORIALES (FLECHAS, NODOS, BADGES)
   ========================================================================== */

.hub-item {
  cursor: pointer;
  pointer-events: auto;
}

/* Anillo de pulso (oculto en reposo, anima en hover) */
.hub-pulse-ring {
  fill: none;
  stroke: var(--cyan-core);
  stroke-width: 2.5px;
  opacity: 0;
  transform-origin: center;
  pointer-events: none;
  transition: opacity var(--transition-fast);
}

/* Núcleo central del nodo (oculto en reposo para ver el nodo original) */
.hub-center-core {
  fill: #ffffff;
  stroke: #00e5ff;
  stroke-width: 3.5px;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition-fast), transform var(--transition-fast);
}

/* Área de impacto táctil y de cursor ampliada */
.hub-hit-area {
  fill: transparent;
  cursor: pointer;
  pointer-events: all;
}

/* Flechas con animación de trazo */
.hub-arrow-path {
  fill: none;
  stroke: #00e5ff;
  stroke-width: 4.5px;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0;
  stroke-dasharray: 450;
  stroke-dashoffset: 450;
  filter: drop-shadow(0 0 6px rgba(0, 229, 255, 0.85));
  transition: stroke-dashoffset 0.45s cubic-bezier(0.16, 1, 0.3, 1),
              opacity 0.25s ease;
  pointer-events: none;
}

/* Insignias / Badges */
.hub-badge {
  opacity: 0;
  transform-origin: center;
  transform: scale(0.92);
  transition: opacity 0.3s ease,
              transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: auto;
  cursor: pointer;
}

.hub-badge-box {
  fill: #ffffff;
  stroke: #00e5ff;
  stroke-width: 2.8px;
  filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.85))
          drop-shadow(0 0 20px rgba(0, 229, 255, 0.4));
  transition: filter var(--transition-fast), stroke-width var(--transition-fast);
}

.hub-badge-text {
  font-family: var(--font-tech);
  font-size: 24px;
  font-weight: 700;
  fill: #0a2540;
  text-anchor: middle;
  dominant-baseline: central;
  letter-spacing: 0.3px;
  user-select: none;
}

/* ==========================================================================
   ESTADO ACTIVO / HOVER: DESPLIEGUE FLUIDO DE FLECHAS Y NODOS
   ========================================================================== */

.hub-item:hover .hub-arrow-path,
.hub-item.is-active .hub-arrow-path {
  opacity: 1;
  stroke-dashoffset: 0;
}

.hub-item:hover .hub-badge,
.hub-item.is-active .hub-badge {
  opacity: 1;
  transform: scale(1);
}

.hub-item:hover .hub-badge-box,
.hub-item.is-active .hub-badge-box {
  stroke-width: 3.5px;
  filter: drop-shadow(0 0 14px rgba(0, 229, 255, 1))
          drop-shadow(0 0 28px rgba(0, 229, 255, 0.6));
}

.hub-item:hover .hub-pulse-ring,
.hub-item.is-active .hub-pulse-ring {
  opacity: 1;
  animation: pulseBeacon 1.4s infinite cubic-bezier(0.2, 0.8, 0.2, 1);
}

.hub-item:hover .hub-center-core,
.hub-item.is-active .hub-center-core {
  opacity: 1;
  filter: drop-shadow(0 0 14px #00e5ff);
}

@keyframes pulseBeacon {
  0% {
    r: 16px;
    opacity: 0.9;
  }
  70% {
    r: 44px;
    opacity: 0;
  }
  100% {
    r: 44px;
    opacity: 0;
  }
}

/* ==========================================================================
   RESPONSIVIDAD Y OPTIMIZACIÓN
   ========================================================================== */
@media (max-width: 768px) {
  .map-viewport {
    padding: 5px 0;
  }

  .hub-badge-text {
    font-size: 21px;
  }
}

</style>
</head>

  <script>
/**
 * MAPA DE DISTRIBUIDORES - VILLALBA HNOS. IMPLANTES S.A.
 * Lógica interactiva de despliegue de flechas al pasar el cursor (hover)
 */

document.addEventListener('DOMContentLoaded', () => {
  const hubItems = document.querySelectorAll('.hub-item');

  hubItems.forEach(item => {
    // Al pasar el cursor sobre el punto o insignia
    item.addEventListener('mouseenter', () => {
      item.classList.add('is-active');
    });

    // Al retirar el cursor
    item.addEventListener('mouseleave', () => {
      item.classList.remove('is-active');
    });

    // Soporte para dispositivos táctiles (tap para activar/desactivar)
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      const wasActive = item.classList.contains('is-active');
      hubItems.forEach(i => i.classList.remove('is-active'));
      if (!wasActive) {
        item.classList.add('is-active');
      }
    });
  });

  // Cerrar punto activo al tocar fuera en pantallas táctiles
  document.addEventListener('click', () => {
    hubItems.forEach(i => i.classList.remove('is-active'));
  });
});

</script>
